name: dashboard
description: "A nature-inspired macOS-like system dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # Charts for the live metric graphs.
  fl_chart: ^1.3.1

  # Networking: REST for snapshots, websocket for the live stream.
  http: ^1.6.0
  web_socket_channel: ^3.0.3

  # Icon sets. Lucide is an ISC licensed set of thin, geometric outlines that
  # reads closest to the SF Symbols look without shipping Apple's assets.
  lucide_icons_flutter: ^4.0.3
  cupertino_icons: ^1.0.8

  # Frameless macOS style window with a custom title bar.
  window_manager: ^0.7.0

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
